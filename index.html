<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Théorème de Pythagore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--ink:#1e2a78;--ink2:#3b4cc0;--text:#1f2433;--muted:#667085;--paper:#fffefa;--line:#d9e2f5;--margin:#e5484d;--a:#14a38b;--b:#f08c00;--c:#7c5cff;--ok:#12a150;--bad:#e03131;--warn:#d9730d}
html,body{margin:0;padding:0;background:#eef2fb;color:var(--text);font-family:Nunito,"Segoe UI",Arial,sans-serif}
body{padding:12px}
#pyth-live2{width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:10px;font-size:15px}
#pyth-live2 .hidden{display:none!important}
#pyth-live2 .topline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 4px}
#pyth-live2 .topline strong{font-size:21px;font-weight:800;color:var(--ink)}
#pyth-live2 .topline .right{display:flex;align-items:center;gap:8px}
#pyth-live2 .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:700;font-size:13px;color:var(--ink)}
#pyth-live2 .muted{color:var(--muted)}
#pyth-live2 .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 24px rgba(30,42,120,.07)}
#pyth-live2 .question{font-weight:700;margin-bottom:8px;font-size:16px;color:var(--ink)}
#pyth-live2 .instruction{font-size:14px;color:var(--muted);margin-bottom:10px;line-height:1.45;max-width:70ch}
#pyth-live2 .workgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.9fr);gap:14px;align-items:stretch}
#pyth-live2 .figure-layout{display:block}
#pyth-live2 #pl-drawing{min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
 background-color:#fff;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
 background-size:24px 24px}
#pyth-live2 svg{width:100%;height:500px;max-height:58vh;min-height:380px;display:block}
#pyth-live2 .sq{stroke-width:2.4;stroke-linejoin:round}
#pyth-live2 .sq0{fill:var(--a);fill-opacity:.16;stroke:var(--a)}
#pyth-live2 .sq1{fill:var(--b);fill-opacity:.16;stroke:var(--b)}
#pyth-live2 .sq2{fill:var(--c);fill-opacity:.15;stroke:var(--c)}
#pyth-live2 .tri{fill:#fff;fill-opacity:.85;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
#pyth-live2 .vertex{font-size:19px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
#pyth-live2 .len{font-size:16px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
#pyth-live2 .len.unk{font-size:24px}
#pyth-live2 .len0{fill:#0b7a68}
#pyth-live2 .len1{fill:#b36200}
#pyth-live2 .len2{fill:#5a3fd6}
#pyth-live2 .side-key{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px;font-size:14px}
#pyth-live2 .side-key strong{margin-right:4px;color:var(--muted);font-weight:600}
#pyth-live2 .side-key div{white-space:nowrap;background:#fff;border:1px solid var(--line);border-left:5px solid var(--ink2);border-radius:8px;padding:4px 10px;font-weight:700}
#pyth-live2 .side-key div:nth-of-type(1){border-left-color:var(--a)}
#pyth-live2 .side-key div:nth-of-type(2){border-left-color:var(--b)}
#pyth-live2 .side-key div:nth-of-type(3){border-left-color:var(--c)}
#pyth-live2 input{background:#fff;border:2px solid #b8c4e6;border-radius:9px;padding:8px;color:var(--text);text-align:center;min-width:0;font:700 15px Nunito,Arial,sans-serif;transition:border-color .15s,box-shadow .15s}
#pyth-live2 input:focus{outline:none;border-color:var(--ink2);box-shadow:0 0 0 4px rgba(59,76,192,.18)}
#pyth-live2 input.good{background:#e3f8ea!important;border:3px solid var(--ok)!important;color:#0b5b2c!important;font-weight:800!important;opacity:1!important}
#pyth-live2 input.bad{background:#ffe8e8!important;border:3px solid var(--bad)!important;color:#8f1d1d!important;font-weight:800!important;opacity:1!important}
#pyth-live2 input:read-only{cursor:default;opacity:1}
#pyth-live2 button{appearance:none;-webkit-appearance:none;border:0!important;border-radius:10px!important;padding:10px 16px!important;font:800 14px Nunito,Arial,sans-serif!important;background:var(--ink2)!important;color:#fff!important;cursor:pointer!important;opacity:1;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
#pyth-live2 button:hover:not(:disabled){background:#2f3fae!important}
#pyth-live2 button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#pyth-live2 button:focus-visible{outline:3px solid #ffd43b;outline-offset:2px}
#pyth-live2 button:disabled{opacity:.45!important;cursor:not-allowed!important;box-shadow:none}
#pyth-live2 .proof{border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;line-height:30px;font-size:15px;min-height:100%;overflow-wrap:anywhere;position:relative;
 background-color:#fff;
 background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 30px;background-position:0 11px}
#pyth-live2 .proof::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
#pyth-live2 .proof>strong{display:block;color:var(--ink);font-size:15px;font-weight:800;line-height:30px;margin-bottom:0}
#pyth-live2 .proof p{margin:0;font-family:Kalam,"Comic Sans MS",cursive;font-size:17px;color:#26307a}
#pyth-live2 .proof .muted{font-family:Nunito,sans-serif;font-size:14px}
#pyth-live2 .formula{font-weight:700;color:var(--ink);margin-top:0}
#pyth-live2 .feedback{font-size:14px;font-weight:600;line-height:1.45;min-height:20px;margin-top:8px}
#pyth-live2 .step2{border-top:2px dashed var(--line);padding-top:10px;margin-top:10px}
#pyth-live2 .flex{display:flex}
#pyth-live2 .items-center{align-items:center}
#pyth-live2 .gap-2{gap:8px}
#pyth-live2 .w-full{width:100%}
#pyth-live2 .max-w-sm{max-width:360px}
#pyth-live2 .font-semibold{font-weight:800}
#pyth-live2 .font-bold{font-weight:800}
#pyth-live2 .mb-2{margin-bottom:8px}
#pyth-live2 .mt-2{margin-top:8px}
#pyth-live2 .text-sm{font-size:14px}
#pyth-live2 .text-lg{font-size:19px}
#pyth-live2 .text-xl{font-size:26px;color:var(--ink)}
#pyth-live2 .text-center{text-align:center}
#pyth-live2 .finish-form{max-width:440px;margin:14px auto 6px}
#pyth-live2 .finish-form label{display:block;font-size:14px;font-weight:800;margin:12px 0 5px}
#pyth-live2 .finish-form input{width:100%;text-align:left;padding:10px}
#pyth-live2 .finish-form button{margin-top:16px;width:100%}
#pyth-live2 .send-status{font-size:14px;font-weight:600;text-align:center;margin-top:10px;min-height:20px}
#pyth-live2 .bottomline{display:flex;justify-content:flex-end}
@media(max-width:720px){
 body{padding:6px}
 #pyth-live2 .workgrid{grid-template-columns:1fr}
 #pyth-live2 svg{height:420px;max-height:none;min-height:340px}
 #pyth-live2 .proof{min-height:auto}
}
@media(min-width:721px) and (max-height:800px){
 #pyth-live2 svg{height:430px;min-height:340px;max-height:52vh}
 #pyth-live2 .panel{padding:10px}
 #pyth-live2{gap:8px}
}
@media(prefers-reduced-motion:reduce){#pyth-live2 *{transition:none!important}}
</style>
</head>
<body>
<div id="pyth-live2">
 <div class="topline">
  <strong>Théorème de Pythagore</strong>
  <div class="right"><span id="pl-count" class="pill">Question 1 / 5</span><span id="pl-score" class="pill">Score : 0 / 5</span></div>
 </div>
 <div class="panel">
  <div id="pl-question" class="question"></div>
  <div id="pl-side-key" class="side-key"></div>
  <div class="workgrid" id="pl-workgrid">
   <div>
    <div class="figure-layout">
     <div id="pl-drawing"></div>
    </div>
    <div id="pl-area-feedback" class="feedback" aria-live="polite"></div>
    <div id="pl-area-controls" style="margin-top:8px">
     <div id="pl-instruction" class="instruction"></div>
     <button id="pl-verify-areas" type="button">Vérifier les aires</button>
    </div>
    <div id="pl-length-zone" class="step2 hidden">
     <div id="pl-instruction2" class="instruction"></div>
     <div class="flex items-center gap-2 max-w-sm">
      <input id="pl-length-answer" type="number" step="any" placeholder="…" aria-label="Longueur recherchée" style="width:84px;height:36px;font-size:17px">
      <button id="pl-verify-length" type="button">Vérifier</button>
      <button id="pl-next" type="button" class="hidden">Question suivante</button>
     </div>
     <div id="pl-length-feedback" class="feedback" aria-live="polite"></div>
    </div>
   </div>
   <div class="proof">
    <strong>Rédaction</strong>
    <div id="pl-proof" class="muted"></div>
   </div>
  </div>
  <div id="pl-finish" class="hidden finish-form">
   <div class="text-center">
    <div class="font-bold text-xl">Exercice terminé !</div>
    <div class="text-lg mt-2">Ton score : <strong id="pl-final-score">0 / 5</strong></div>
    <p class="text-sm muted mt-2">Indique ton prénom et ta classe pour envoyer ton résultat à ton professeur.</p>
   </div>
   <form id="pl-result-form">
    <label for="pl-firstname">Prénom</label>
    <input id="pl-firstname" name="prenom" type="text" maxlength="50" required autocomplete="given-name" placeholder="Ton prénom">
    <label for="pl-class">Classe</label>
    <input id="pl-class" name="classe" type="text" maxlength="30" required placeholder="Exemple : 3e A">
    <button id="pl-send-result" type="submit">Envoyer mon résultat</button>
    <div id="pl-send-status" class="send-status" aria-live="polite"></div>
   </form>
  </div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
(()=>{
const root=document.getElementById('pyth-live2');
if(!root||root.dataset.ready)return;
root.dataset.ready='1';
const $=id=>root.querySelector('#pl-'+id);
const EMAILJS_PUBLIC_KEY='ATJ81EsZMjUM7kMEV';
const EMAILJS_SERVICE_ID='service_ddxhm89';
const EMAILJS_TEMPLATE_ID='template_ycpslgy';
let emailReady=false;
if(window.emailjs){try{window.emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});emailReady=true}catch(error){console.error('Initialisation EmailJS impossible :',error)}}
const triples=[
 [3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],
 [6,8,10],[9,12,15],[10,24,26],[12,16,20],[15,20,25],
 [16,30,34],[18,24,30],[21,28,35],[12,35,37],[9,40,41],
 [11,60,61],[28,45,53],[33,56,65],[13,84,85],[36,77,85],
 [24,45,51],[20,48,52],[14,48,50],[27,36,45],[30,40,50],
 [15,36,39]
].filter(t=>t[0]>0);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const firstQuestionPool=triples.filter(t=>t[0]>=1&&t[0]<=15&&t[1]>=1&&t[1]<=15);
const firstTwo=shuffle(firstQuestionPool).slice(0,2);
const remaining=shuffle(triples.filter(t=>!firstTwo.some(chosen=>
 chosen[0]===t[0]&&chosen[1]===t[1]&&chosen[2]===t[2]
))).slice(0,3);
const chosen=[...firstTwo,...remaining];
const vertices=[['A','B','C'],['M','N','P'],['R','S','T'],['D','E','F'],['K','L','M']];
const all=chosen.map((t,i)=>({v:vertices[i],a:t[0],b:t[1],u:'c'}));
const legCount=2+Math.floor(Math.random()*2);
const lastTargets=shuffle(['a','b']).slice(0,2);
if(legCount===3)lastTargets.push(shuffle(['a','b'])[0]);
else lastTargets.push('c');
all[2].u=lastTargets[0];
all[3].u=lastTargets[1];
all[4].u=lastTargets[2];
const order=[0,1,...shuffle([2,3,4])];
let index=0,score=0,q,lengthTries=0,areaTries=0,qPos=null;
const lenInput=$('length-answer'),lenRow=lenInput.parentNode;
const names=q=>({a:q.v[0]+q.v[1],b:q.v[0]+q.v[2],c:q.v[1]+q.v[2]});
const areas=q=>({a:q.a*q.a,b:q.b*q.b,c:q.a*q.a+q.b*q.b});
const sideLengths=q=>({a:q.a,b:q.b,c:Math.hypot(q.a,q.b)});
const target=q=>q.u==='c'?Math.hypot(q.a,q.b):q.u==='a'?q.a:q.b;
const close=(x,y)=>Number.isFinite(x)&&Math.abs(x-y)<.011;
const P=(x,y)=>({x,y}),add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k),dot=(a,b)=>a.x*b.x+a.y*b.y;
function normal(p,r,t){const d=sub(r,p),len=Math.hypot(d.x,d.y);let n=P(-d.y/len,d.x/len);if(dot(n,sub(t,mul(add(p,r),.5)))>0)n=mul(n,-1);return n}
function square(p,r,t){const d=sub(r,p),len=Math.hypot(d.x,d.y),n=normal(p,r,t),off=mul(n,len);return[p,r,add(r,off),add(p,off)]}
function render(){
 q=all[order[index]];lengthTries=0;areaTries=0;
 $('count').textContent='Question '+(index+1)+' / 5';
 $('question').textContent='Calcule la longueur '+names(q)[q.u]+'.';
 $('instruction').textContent="Étape 1 : Calcule l'aire des carrés dont tu connais le côté et utilise l'égalité de Pythagore pour en déduire l'aire du troisième carré.";
 $('length-zone').classList.add('hidden');$('next').classList.add('hidden');
 $('area-feedback').textContent='';$('area-feedback').style.color='#1f2433';
 $('length-feedback').textContent='';$('proof').innerHTML='';
 $('area-controls').classList.remove('hidden');$('verify-areas').disabled=false;
 lenRow.insertBefore(lenInput,lenRow.firstChild);lenInput.value='';lenInput.readOnly=false;lenInput.classList.remove('good','bad');$('verify-length').disabled=false;qPos=null;draw();
}
function draw(){
 const a=q.a*22,b=q.b*22;let pts=[P(0,0),P(a,0),P(0,b)];
 const angle=[0,Math.PI/2,Math.PI*1.5,Math.PI][index%4],mirror=index%2?-1:1;
 const center=mul(add(add(pts[0],pts[1]),pts[2]),1/3);
 pts=pts.map(p=>{let z=mul(sub(p,center),mirror);const c=Math.cos(angle),s=Math.sin(angle);return P(z.x*c-z.y*s+center.x,z.x*s+z.y*c+center.y)});
 const [A,B,C]=pts,sq=[square(A,B,C),square(A,C,B),square(B,C,A)];
 const allPts=[...pts,...sq.flat()],minX=Math.min(...allPts.map(p=>p.x)),maxX=Math.max(...allPts.map(p=>p.x)),minY=Math.min(...allPts.map(p=>p.y)),maxY=Math.max(...allPts.map(p=>p.y));
 const scale=Math.min(700/(maxX-minX),470/(maxY-minY)),X=x=>50+(x-minX)*scale,Y=y=>45+(y-minY)*scale,poly=p=>p.map(z=>`${X(z.x)},${Y(z.y)}`).join(' ');
 const centers=sq.map(p=>mul(p.reduce((s,z)=>add(s,z),P(0,0)),.25));
 let svg='<svg viewBox="0 0 800 560" role="img" aria-label="Triangle rectangle et trois carrés">';
 sq.forEach((p,i)=>svg+=`<polygon class="sq sq${i}" points="${poly(p)}"/>`);
 svg+=`<polygon class="tri" points="${poly(pts)}"/>`;
 const u=mul(sub(B,A),1/Math.hypot(B.x-A.x,B.y-A.y)),w=mul(sub(C,A),1/Math.hypot(C.x-A.x,C.y-A.y)),r=20;
 const p1=add(A,mul(u,r)),p2=add(add(A,mul(u,r)),mul(w,r)),p3=add(A,mul(w,r));
 svg+=`<polyline points="${X(p1.x)},${Y(p1.y)} ${X(p2.x)},${Y(p2.y)} ${X(p3.x)},${Y(p3.y)}" fill="none" stroke="#1e2a78" stroke-width="2.4"/>`;
 pts.forEach((p,i)=>{svg+=`<text class="vertex" x="${X(p.x)+(i===1?12:-18)}" y="${Y(p.y)+(i===2?21:-10)}">${q.v[i]}</text>`});
 const drawLabels=()=>{
  const R=(x,y,w,h)=>({x1:x-w,x2:x+w,y1:y-h,y2:y+h}),ov=(a,b)=>Math.max(0,Math.min(a.x2,b.x2)-Math.max(a.x1,b.x1))*Math.max(0,Math.min(a.y2,b.y2)-Math.max(a.y1,b.y1)),vb=R(400,280,396,276),placed=[];
  const sides=[[A,B,'a',q.a,C],[A,C,'b',q.b,B],[B,C,'c',Math.hypot(q.a,q.b),A]].map((s,i)=>[...s,i]);
  // Cherche la meilleure position le long d'un côté (au milieu en priorité), sans chevaucher les autres éléments.
  const place=([p1,p2,key,val,t,i],hw,hh,offs,avoid)=>{
   const ni=mul(normal(p1,p2,t),-1),k=Math.abs(ni.x)*hw+Math.abs(ni.y)*hh+4,sx=X(p1.x),sy=Y(p1.y),ex=X(p2.x),ey=Y(p2.y);
   let best=null,bc=1e12,n=0;
   [.5,.4,.6,.3,.7,.2,.8].forEach(f=>offs(k).forEach(o=>{
    const x=sx+(ex-sx)*f+ni.x*o,y=sy+(ey-sy)*f+ni.y*o,r=R(x,y,hw,hh);
    let c=n++*.5+5*(4*hw*hh-ov(r,vb));
    avoid.forEach(b=>c+=3*ov(r,b));inRects.forEach(b=>c+=2*ov(r,b));
    if(c<bc){bc=c;best=[x,y]}}));
   return best};
  const U=sides.find(s=>s[2]===q.u),lab=[];
  // 1) emplacement de la future boîte « AB = … cm » : posée sur son propre côté
  qPos=place(U,80,22,k=>[0,k,-k],[]);
  const boxR=R(qPos[0],qPos[1],80,22);
  // 2) longueurs données, puis « ? » : toujours collés à leur côté
  [...sides.filter(s=>s[2]!==q.u),U].forEach(s=>{
   const unk=s[2]===q.u,txt=unk?'?':s[3]+' cm',hw=unk?7:txt.length*4.8+2,hh=unk?12:9,best=place(s,hw,hh,k=>[k,k+12,0],unk?lab:[...lab,boxR]);
   lab.push(R(best[0],best[1],hw,hh));
   svg+=`<text class="len len${s[5]}${unk?' unk':''}" x="${best[0]}" y="${best[1]}">${txt}</text>`})};
 const inRects=[];
 centers.forEach((p,i)=>{const key=['a','b','c'][i],cx=X(p.x),cy=Y(p.y),s=Math.hypot(sq[i][1].x-sq[i][0].x,sq[i][1].y-sq[i][0].y)*scale,w=Math.round(Math.max(56,Math.min(90,s-14))),h=Math.round(Math.max(30,Math.min(40,s-14))),fs=w>70?17:15;inRects.push({x1:cx-w/2,x2:cx+w/2,y1:cy-h/2,y2:cy+h/2});svg+=`<foreignObject x="${cx-(w+8)/2}" y="${cy-(h+6)/2}" width="${w+8}" height="${h+6}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w+8}px;height:${h+6}px;display:flex;align-items:center;justify-content:center"><input data-area="${key}" type="number" step="any" aria-label="Aire du carré sur ${names(q)[key]}" placeholder="Aire" style="width:${w}px;height:${h}px;text-align:center;font-size:${fs}px;padding:3px"/></div></foreignObject>`});
 drawLabels();svg+='</svg>'; $('drawing').innerHTML=svg;
 const n=names(q),lengths=sideLengths(q);
 $('side-key').innerHTML=`<strong>Longueurs</strong><div>${n.a} = ${q.u==='a'?'?':lengths.a+' cm'}</div><div>${n.b} = ${q.u==='b'?'?':lengths.b+' cm'}</div><div>${n.c} = ${q.u==='c'?'?':lengths.c+' cm'}</div>`;
}
function proofAreas(){
 const n=names(q),e=areas(q);let html=`<p>Le triangle ${q.v.join('')} est rectangle en ${q.v[0]}.</p><p>L'hypoténuse est [${n.c}].</p><p>D'après le théorème de Pythagore :</p><p class="formula">${n.c}² = ${n.a}² + ${n.b}²</p>`;
 if(q.u==='c')html+=`<p class="formula">${n.c}² = ${e.a} + ${e.b} = ${e.c} cm²</p>`;
 else if(q.u==='a')html+=`<p class="formula">${n.a}² = ${n.c}² − ${n.b}²</p><p class="formula">${n.a}² = ${e.c} − ${e.b} = ${e.a} cm²</p>`;
 else html+=`<p class="formula">${n.b}² = ${n.c}² − ${n.a}²</p><p class="formula">${n.b}² = ${e.c} − ${e.a} = ${e.b} cm²</p>`;
 $('proof').innerHTML=html;
}
function goToLength(){$('area-controls').classList.add('hidden');$('length-zone').classList.remove('hidden');$('instruction2').textContent='Étape 2 : déduis-en la longueur recherchée.';
 const svgEl=$('drawing').querySelector('svg'),t=svgEl&&svgEl.querySelector('.unk');
 if(t&&qPos){t.style.display='none';const fo=document.createElementNS('http://www.w3.org/2000/svg','foreignObject');fo.setAttribute('x',qPos[0]-80);fo.setAttribute('y',qPos[1]-22);fo.setAttribute('width',160);fo.setAttribute('height',44);
  const d=document.createElement('div');d.style.cssText='width:160px;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:2px solid #3b4cc0;border-radius:12px;box-shadow:0 3px 10px rgba(30,42,120,.25);font:800 18px Nunito,Arial,sans-serif;color:#1e2a78';
  lenInput.style.width='58px';lenInput.style.height='30px';
  d.innerHTML=`<span>${names(q)[q.u]} =</span>`;d.appendChild(lenInput);d.insertAdjacentHTML('beforeend','<span>cm</span>');fo.appendChild(d);svgEl.appendChild(fo);lenInput.focus()}}
function setAreaState(el,state){el.classList.remove('good','bad');el.classList.add(state);el.style.setProperty('background-color',state==='good'?'#e3f8ea':'#ffe8e8','important');el.style.setProperty('border',state==='good'?'3px solid #12a150':'3px solid #e03131','important');el.style.setProperty('color',state==='good'?'#0b5b2c':'#8f1d1d','important');el.style.setProperty('font-weight','800','important')}
function areaAdvice(wrongKeys){
 const n=names(q),advice=[];
 wrongKeys.forEach(k=>{
  if(k==='a'&&q.u==='a')advice.push(`${n.a}² : pour trouver l'aire de ce carré, soustrais l'aire de l'autre petit carré à celle du carré de l'hypoténuse.`);
  else if(k==='b'&&q.u==='b')advice.push(`${n.b}² : pour trouver l'aire de ce carré, soustrais l'aire de l'autre petit carré à celle du carré de l'hypoténuse.`);
  else if(k==='c'&&q.u==='c')advice.push(`${n.c}² : pour trouver l'aire du carré construit sur l'hypoténuse, additionne les aires des deux autres carrés.`);
  else advice.push(`${n[k]}² : pour calculer l'aire de ce carré, multiplie la longueur de son côté par elle-même.`);
 });
 return advice.join('<br>');
}
$('verify-areas').addEventListener('click',()=>{
 areaTries++;const e=areas(q);let allCorrect=true;const wrongKeys=[];
 ['a','b','c'].forEach(k=>{const el=root.querySelector(`[data-area="${k}"]`);if(el.readOnly)return;const correct=el.value.trim()!==''&&close(Number(el.value),e[k]);if(correct){setAreaState(el,'good');el.readOnly=true}else{setAreaState(el,'bad');wrongKeys.push(k);allCorrect=false}});
 ['a','b','c'].forEach(k=>{const el=root.querySelector(`[data-area="${k}"]`);if(!el.readOnly)allCorrect=false});
 if(allCorrect){$('area-feedback').textContent='Les trois aires sont correctes.';$('area-feedback').style.color='#12a150';proofAreas();goToLength();return}
 if(areaTries>=2){
  ['a','b','c'].forEach(k=>{const el=root.querySelector(`[data-area="${k}"]`);if(!el.readOnly){el.value=e[k];setAreaState(el,'good');el.readOnly=true}});
  $('area-feedback').textContent='Voici les aires correctes. Tu peux maintenant passer au calcul de la longueur.';$('area-feedback').style.color='#d9730d';proofAreas();goToLength();
 }else{$('area-feedback').innerHTML='Certaines aires sont incorrectes.<br>'+areaAdvice(wrongKeys);$('area-feedback').style.color='#1f2433'}
});
$('verify-length').addEventListener('click',()=>{
 const answer=Number(lenInput.value),correct=target(q);
 if(close(answer,correct)){lenInput.classList.remove('bad');lenInput.classList.add('good');lenInput.readOnly=true;
  if(lengthTries<2)score+=areaTries>=2?0.5:1;
  $('score').textContent=`Score : ${score} / 5`;$('length-feedback').textContent='Bonne réponse !';$('length-feedback').style.color='#12a150';$('verify-length').disabled=true;$('next').classList.remove('hidden');proofLength();
 }else{
  lengthTries++;lenInput.classList.add('bad');
  if(lengthTries<2){$('length-feedback').textContent='Ce n’est pas la bonne réponse. Essaie encore.';$('length-feedback').style.color='#d9730d'}
  else{lenInput.value=correct;lenInput.classList.remove('bad');lenInput.classList.add('good');lenInput.readOnly=true;$('length-feedback').textContent=`La longueur recherchée est ${correct} cm.`;$('length-feedback').style.color='#d9730d';$('verify-length').disabled=true;$('next').classList.remove('hidden');proofLength()}
 }
});
lenInput.addEventListener('input',()=>lenInput.classList.remove('bad'));
lenInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('verify-length').click()}});
function proofLength(){
 const n=names(q),e=areas(q),k=q.u,known=k==='a'?'b':'a',missing=n[k],knownName=n[known],c=n.c;
 if(k==='c')$('proof').innerHTML+=`<p class="formula">${c} = √${e.c} = ${target(q)} cm</p>`;
 else{const knownSq=e[known],missingSq=e.c-knownSq;$('proof').innerHTML+=`<p class="formula">${missing}² = ${c}² − ${knownName}²</p><p class="formula">${missing}² = ${e.c} − ${knownSq} = ${missingSq} cm²</p><p class="formula">${missing} = √${missingSq} = ${target(q)} cm</p>`}
}
function finishExercise(){
 $('question').textContent='';$('instruction').textContent='';$('workgrid').classList.add('hidden');
 $('drawing').innerHTML='';$('side-key').innerHTML='';$('side-key').classList.add('hidden');$('length-zone').classList.add('hidden');$('area-controls').classList.add('hidden');$('area-feedback').textContent='';$('proof').innerHTML='';
 $('next').classList.add('hidden');$('count').classList.add('hidden');$('final-score').textContent=`${score} / 5`;$('finish').classList.remove('hidden');
}
$('result-form').addEventListener('submit',async event=>{
 event.preventDefault();const prenom=$('firstname').value.trim(),classe=$('class').value.trim(),button=$('send-result'),status=$('send-status');
 if(!prenom||!classe){status.textContent='Merci de renseigner ton prénom et ta classe.';status.style.color='#e03131';return}
 if(!emailReady||!window.emailjs){status.textContent="Le service d'envoi n'est pas disponible. Préviens ton professeur.";status.style.color='#e03131';return}
 button.disabled=true;button.textContent='Envoi en cours…';status.textContent='';
 const dateEnvoi=new Date().toLocaleString('fr-FR');
 const templateParams={prenom,name:prenom,student_name:prenom,classe,class:classe,student_class:classe,score:`${score} / 5`,resultat:`${score} / 5`,result:`${score} / 5`,note:`${score} / 5`,date:dateEnvoi,date_envoi:dateEnvoi,exercise:'Théorème de Pythagore',exercice:'Théorème de Pythagore',exercise_name:'Théorème de Pythagore',exerciseur:'Théorème de Pythagore'};
 try{await window.emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,templateParams);status.textContent='Résultat envoyé à ton professeur. Merci !';status.style.color='#12a150';button.textContent='Résultat envoyé'}
 catch(error){console.error('Erreur EmailJS :',error);status.textContent="L'envoi a échoué. Vérifie les informations ou préviens ton professeur.";status.style.color='#e03131';button.disabled=false;button.textContent='Réessayer'}
});
$('next').addEventListener('click',()=>{index++;if(index>=5){finishExercise();return}render()});
render();
})();
</script>
