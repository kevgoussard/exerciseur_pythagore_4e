<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
(()=>{
const root=document.getElementById('pyth-live2');
if(!root||root.dataset.ready)return;
root.dataset.ready='1';

const $=id=>root.querySelector('#pl-'+id);

/* Configuration EmailJS : identifiants repris de l'exerciseur Thalès */
const EMAILJS_PUBLIC_KEY='ATJ81EsZMjUM7kMEV';
const EMAILJS_SERVICE_ID='service_ddxhm89';
const EMAILJS_TEMPLATE_ID='template_ycpslgy';

let emailReady=false;

if(window.emailjs){
 try{
  emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});
  emailReady=true;
 }catch(error){
  console.error('Initialisation EmailJS impossible :',error);
 }
}

const all=[
 {v:['A','B','C'],a:3,b:4,u:'c'},
 {v:['M','N','P'],a:5,b:12,u:'c'},
 {v:['R','S','T'],a:8,b:15,u:'c'},
 {v:['D','E','F'],a:5,b:12,u:'b'},
 {v:['K','L','M'],a:7,b:24,u:'a'}
];

const shuffle=a=>{
 a=[...a];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
};

const first=shuffle([0,1,2]);
const order=[...first.slice(0,2),...shuffle([first[2],3,4])];

let index=0,score=0,q,lengthTries=0,areaTries=0;

const names=q=>({
 a:q.v[0]+q.v[1],
 b:q.v[0]+q.v[2],
 c:q.v[1]+q.v[2]
});

const areas=q=>({
 a:q.a*q.a,
 b:q.b*q.b,
 c:q.a*q.a+q.b*q.b
});

const sideLengths=q=>({
 a:q.a,
 b:q.b,
 c:Math.hypot(q.a,q.b)
});

const target=q=>q.u==='c'
 ?Math.hypot(q.a,q.b)
 :q.u==='a'?q.a:q.b;

const close=(x,y)=>Number.isFinite(x)&&Math.abs(x-y)<.011;

const P=(x,y)=>({x,y});
const add=(a,b)=>P(a.x+b.x,a.y+b.y);
const sub=(a,b)=>P(a.x-b.x,a.y-b.y);
const mul=(a,k)=>P(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y;

function normal(p,r,t){
 const d=sub(r,p),len=Math.hypot(d.x,d.y);
 let n=P(-d.y/len,d.x/len);
 if(dot(n,sub(t,mul(add(p,r),.5)))>0)n=mul(n,-1);
 return n;
}

function square(p,r,t){
 const d=sub(r,p),len=Math.hypot(d.x,d.y);
 const n=normal(p,r,t),off=mul(n,len);
 return[p,r,add(r,off),add(p,off)];
}

function render(){
 q=all[order[index]];
 lengthTries=0;
 areaTries=0;

 $('question').textContent='Calcule la longueur '+names(q)[q.u]+'.';

 $('instruction').textContent=
 "Étape 1 : Calcule l'aire des carrés dont tu connais le côté et utilise l'égalité de Pythagore pour en déduire l'aire du troisième carré.";

 $('length-zone').classList.add('hidden');
 $('next').classList.add('hidden');

 $('area-feedback').textContent='';
 $('area-feedback').style.color='var(--viz-text)';
 $('length-feedback').textContent='';
 $('proof').innerHTML='';

 $('area-controls').classList.remove('hidden');
 $('verify-areas').disabled=false;
 $('verify-areas').classList.remove('hidden');

 $('length-answer').value='';
 $('verify-length').disabled=false;

 draw();
}

function draw(){
 const a=q.a*22,b=q.b*22;
 let pts=[P(0,0),P(a,0),P(0,b)];

 const angle=[0,Math.PI/2,Math.PI*1.5,Math.PI][index%4];
 const mirror=index%2?-1:1;
 const center=mul(add(add(pts[0],pts[1]),pts[2]),1/3);

 pts=pts.map(p=>{
  let z=mul(sub(p,center),mirror);
  const c=Math.cos(angle),s=Math.sin(angle);
  return P(z.x*c-z.y*s+center.x,z.x*s+z.y*c+center.y);
 });

 const [A,B,C]=pts;
 const sq=[
  square(A,B,C),
  square(A,C,B),
  square(B,C,A)
 ];

 const allPts=[...pts,...sq.flat()];
 const minX=Math.min(...allPts.map(p=>p.x));
 const maxX=Math.max(...allPts.map(p=>p.x));
 const minY=Math.min(...allPts.map(p=>p.y));
 const maxY=Math.max(...allPts.map(p=>p.y));

 const scale=Math.min(700/(maxX-minX),470/(maxY-minY));

 const X=x=>50+(x-minX)*scale;
 const Y=y=>45+(y-minY)*scale;
 const poly=p=>p.map(z=>`${X(z.x)},${Y(z.y)}`).join(' ');

 const centers=sq.map(p=>
  mul(p.reduce((s,z)=>add(s,z),P(0,0)),.25)
 );

 let svg='<svg viewBox="0 0 800 560" role="img" aria-label="Triangle rectangle et trois carrés">';

 sq.forEach(p=>svg+=`<polygon class="sq" points="${poly(p)}"/>`);
 svg+=`<polygon class="tri" points="${poly(pts)}"/>`;

 const u=mul(sub(B,A),1/Math.hypot(B.x-A.x,B.y-A.y));
 const w=mul(sub(C,A),1/Math.hypot(C.x-A.x,C.y-A.y));
 const r=20;

 const p1=add(A,mul(u,r));
 const p2=add(add(A,mul(u,r)),mul(w,r));
 const p3=add(A,mul(w,r));

 svg+=`<polyline points="${X(p1.x)},${Y(p1.y)} ${X(p2.x)},${Y(p2.y)} ${X(p3.x)},${Y(p3.y)}" fill="none" stroke="var(--viz-text)" stroke-width="2"/>`;

 pts.forEach((p,i)=>{
  svg+=`<text class="vertex" x="${X(p.x)+(i===1?12:-18)}" y="${Y(p.y)+(i===2?21:-10)}">${q.v[i]}</text>`;
 });

 centers.forEach((p,i)=>{
  const key=['a','b','c'][i];
  const cx=X(p.x),cy=Y(p.y);

  svg+=`<foreignObject x="${cx-36}" y="${cy-17}" width="72" height="34">
   <div xmlns="http://www.w3.org/1999/xhtml" style="width:72px;height:34px;display:flex;align-items:center;justify-content:center">
    <input data-area="${key}" type="number" step="any" aria-label="Aire du carré sur ${names(q)[key]}" placeholder="Aire" style="width:64px;height:29px;text-align:center;font-size:14px"/>
   </div>
  </foreignObject>`;
 });

 svg+='</svg>';
 $('drawing').innerHTML=svg;

 const n=names(q);
 const lengths=sideLengths(q);

 $('side-key').innerHTML=`
  <strong>Longueurs</strong>
  <div>${n.a} = ${q.u==='a'?'?':lengths.a+' cm'}</div>
  <div>${n.b} = ${q.u==='b'?'?':lengths.b+' cm'}</div>
  <div>${n.c} = ${q.u==='c'?'?':lengths.c+' cm'}</div>`;
}

function proofAreas(){
 const n=names(q),e=areas(q);
 let html=`
  <p>Le triangle ${q.v.join('')} est rectangle en ${q.v[0]}.</p>
  <p>L'hypoténuse est [${n.c}].</p>
  <p>D'après le théorème de Pythagore :</p>
  <p class="formula">${n.c}² = ${n.a}² + ${n.b}²</p>`;

 if(q.u==='c'){
  html+=`<p class="formula">${n.c}² = ${e.a} + ${e.b} = ${e.c} cm²</p>`;
 }else if(q.u==='a'){
  html+=`
   <p class="formula">${n.a}² = ${n.c}² − ${n.b}²</p>
   <p class="formula">${n.a}² = ${e.c} − ${e.b} = ${e.a} cm²</p>`;
 }else{
  html+=`
   <p class="formula">${n.b}² = ${n.c}² − ${n.a}²</p>
   <p class="formula">${n.b}² = ${e.c} − ${e.a} = ${e.b} cm²</p>`;
 }

 $('proof').innerHTML=html;
}

function goToLength(){
 $('area-controls').classList.add('hidden');
 $('length-zone').classList.remove('hidden');
 $('instruction').textContent='Étape 2 : déduis-en la longueur recherchée.';
}

function setAreaState(el,state){
 el.classList.remove('good','bad');
 el.classList.add(state);
 el.style.setProperty('background-color',state==='good'?'#dcfce7':'#fee2e2','important');
 el.style.setProperty('border',state==='good'?'3px solid #16a34a':'3px solid #dc2626','important');
 el.style.setProperty('color',state==='good'?'#14532d':'#991b1b','important');
 el.style.setProperty('font-weight','800','important');
}

/* Conseils adaptés aux aires réellement erronées */
function areaAdvice(wrongKeys){
 const n=names(q);
 const advice=[];

 wrongKeys.forEach(k=>{
  if(k==='a' && q.u==='a'){
   advice.push(
    `${n.a}² : pour trouver l'aire de ce carré, soustrais l'aire de l'autre petit carré à celle du carré de l'hypoténuse.`
   );
  }else if(k==='b' && q.u==='b'){
   advice.push(
    `${n.b}² : pour trouver l'aire de ce carré, soustrais l'aire de l'autre petit carré à celle du carré de l'hypoténuse.`
   );
  }else if(k==='c' && q.u==='c'){
   advice.push(
    `${n.c}² : pour trouver l'aire du carré construit sur l'hypoténuse, additionne les aires des deux autres carrés.`
   );
  }else{
   advice.push(
    `${n[k]}² : pour calculer l'aire de ce carré, multiplie la longueur de son côté par elle-même.`
   );
  }
 });

 return advice.join('<br>');
}

$('verify-areas').addEventListener('click',()=>{
 areaTries++;
 const e=areas(q);
 let allCorrect=true;
 const wrongKeys=[];

 ['a','b','c'].forEach(k=>{
  const el=root.querySelector(`[data-area="${k}"]`);
  if(el.readOnly)return;

  const correct=el.value.trim()!==''&&close(Number(el.value),e[k]);

  if(correct){
   setAreaState(el,'good');
   el.readOnly=true;
  }else{
   setAreaState(el,'bad');
   wrongKeys.push(k);
   allCorrect=false;
  }
 });

 ['a','b','c'].forEach(k=>{
  const el=root.querySelector(`[data-area="${k}"]`);
  if(!el.readOnly)allCorrect=false;
 });

 if(allCorrect){
  $('area-feedback').textContent='Les trois aires sont correctes.';
  $('area-feedback').style.color='#16a34a';
  proofAreas();
  goToLength();
  return;
 }

 if(areaTries>=2){
  ['a','b','c'].forEach(k=>{
   const el=root.querySelector(`[data-area="${k}"]`);
   if(!el.readOnly){
    el.value=e[k];
    setAreaState(el,'good');
    el.readOnly=true;
   }
  });

  $('area-feedback').textContent=
   'Voici les aires correctes. Tu peux maintenant passer au calcul de la longueur.';

  $('area-feedback').style.color='#d97706';
  proofAreas();
  goToLength();
 }else{
  $('area-feedback').innerHTML=
   'Certaines aires sont incorrectes.<br>'+areaAdvice(wrongKeys);

  $('area-feedback').style.color='var(--viz-text)';
 }
});

$('verify-length').addEventListener('click',()=>{
 const answer=Number($('length-answer').value);
 const correct=target(q);

 if(close(answer,correct)){
  if(lengthTries<2)score++;

  $('score').textContent=`Score : ${score} / 5`;
  $('length-feedback').textContent='Bonne réponse !';
  $('length-feedback').style.color='#16a34a';

  $('verify-length').disabled=true;
  $('next').classList.remove('hidden');

  proofLength();
 }else{
  lengthTries++;

  if(lengthTries<2){
   $('length-feedback').textContent='Ce n’est pas la bonne réponse. Essaie encore.';
   $('length-feedback').style.color='#d97706';
  }else{
   $('length-feedback').textContent=`La longueur recherchée est ${correct} cm.`;
   $('length-feedback').style.color='#d97706';

   $('verify-length').disabled=true;
   $('next').classList.remove('hidden');

   proofLength();
  }
 }
});

function proofLength(){
 const n=names(q),e=areas(q);
 const k=q.u;
 const known=k==='a'?'b':'a';
 const missing=n[k],knownName=n[known],c=n.c;

 if(k==='c'){
  $('proof').innerHTML+=
   `<p class="formula">${c} = √${e.c} = ${target(q)} cm</p>`;
 }else{
  const knownSq=e[known];
  const missingSq=e.c-knownSq;

  $('proof').innerHTML+=`
   <p class="formula">${missing}² = ${c}² − ${knownName}²</p>
   <p class="formula">${missing}² = ${e.c} − ${knownSq} = ${missingSq} cm²</p>
   <p class="formula">${missing} = √${missingSq} = ${target(q)} cm</p>`;
 }
}

/* Fin de l'exercice : affichage du formulaire */
function finishExercise(){
 $('question').textContent='';
 $('instruction').textContent='';
 $('workgrid').classList.add('hidden');

 $('drawing').innerHTML='';
 $('side-key').innerHTML='';
 $('length-zone').classList.add('hidden');
 $('area-controls').classList.add('hidden');
 $('area-feedback').textContent='';
 $('proof').innerHTML='';

 $('next').classList.add('hidden');

 $('final-score').textContent=`${score} / 5`;
 $('finish').classList.remove('hidden');
}

/* Envoi du résultat par EmailJS */
$('result-form').addEventListener('submit',async event=>{
 event.preventDefault();

 const prenom=$('firstname').value.trim();
 const classe=$('class').value.trim();
 const button=$('send-result');
 const status=$('send-status');

 if(!prenom||!classe){
  status.textContent='Merci de renseigner ton prénom et ta classe.';
  status.style.color='#dc2626';
  return;
 }

 if(!emailReady||!window.emailjs){
  status.textContent="Le service d'envoi n'est pas disponible. Préviens ton professeur.";
  status.style.color='#dc2626';
  return;
 }

 button.disabled=true;
 button.textContent='Envoi en cours…';
 status.textContent='';

 const now=new Date();
 const dateEnvoi=now.toLocaleString('fr-FR');

 /*
  Plusieurs noms de variables sont transmis pour rester compatibles
  avec les champs possibles du modèle EmailJS de l'exerciseur Thalès.
 */
 const templateParams={
  prenom:prenom,
  name:prenom,
  student_name:prenom,
  classe:classe,
  class:classe,
  student_class:classe,
  score:`${score} / 5`,
  resultat:`${score} / 5`,
  result:`${score} / 5`,
  note:`${score} / 5`,
  date:dateEnvoi,
  date_envoi:dateEnvoi,
  exercise:'Théorème de Pythagore',
  exercice:'Théorème de Pythagore',
  exercise_name:'Théorème de Pythagore'
 };

 try{
  await emailjs.send(
   EMAILJS_SERVICE_ID,
   EMAILJS_TEMPLATE_ID,
   templateParams
  );

  status.textContent='Résultat envoyé à ton professeur. Merci !';
  status.style.color='#16a34a';
  button.textContent='Résultat envoyé';
 }catch(error){
  console.error('Erreur EmailJS :',error);
  status.textContent="L'envoi a échoué. Vérifie les informations ou préviens ton professeur.";
  status.style.color='#dc2626';
  button.disabled=false;
  button.textContent='Réessayer';
 }
});

$('next').addEventListener('click',()=>{
 index++;

 if(index>=5){
  finishExercise();
  return;
 }

 render();
});

render();
})();
</script>
